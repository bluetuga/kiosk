name: Build CERCIFAF Kiosk ISO

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build ISO (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          # Install syslinux packages for isohybrid
          sudo apt-get install -y --no-install-recommends syslinux syslinux-utils
          # Install live-build and other tools
          sudo apt-get install -y --no-install-recommends \
            live-build debootstrap squashfs-tools xorriso \
            mtools dosfstools \
            curl python3 binutils xz-utils
          # Verify isohybrid is available (provided by syslinux-utils)
          echo "Checking isohybrid..."
          which isohybrid || (echo "isohybrid not found in PATH" && exit 1)
          isohybrid --version
          echo "isohybrid OK"
          # Download syslinux BIOS files from Debian (Ubuntu 24.04 syslinux lacks isolinux.bin)
          # Using Debian 13 (trixie) syslinux-common package contents
          mkdir -p /tmp/syslinux-download
          cd /tmp/syslinux-download
          curl -fsSL "http://deb.debian.org/debian/pool/main/s/syslinux/syslinux-common_6.04~git20190206.bf6db5b4+dfsg1-3_all.deb" -o syslinux-common.deb
          dpkg-deb -x syslinux-common.deb .
          # Copy isolinux files to where live-build expects them
          sudo mkdir -p /root/isolinux
          sudo cp usr/lib/syslinux/bios/isolinux.bin /root/isolinux/
          sudo cp usr/lib/syslinux/bios/vesamenu.c32 /root/isolinux/
          sudo cp usr/lib/syslinux/bios/libcom32.c32 /root/isolinux/
          sudo cp usr/lib/syslinux/bios/libutil.c32 /root/isolinux/
          sudo cp usr/lib/syslinux/bios/menu.c32 /root/isolinux/
          echo "Downloaded syslinux BIOS files to /root/isolinux/"
          ls -la /root/isolinux/

      - name: Build ISO
        run: |
          sudo ./build.sh

      - name: Verify ISO
        run: |
          ls -lh output/cercifaf-kiosk-amd64.iso
          file output/cercifaf-kiosk-amd64.iso
          sha256sum output/cercifaf-kiosk-amd64.iso > output/cercifaf-kiosk-amd64.iso.sha256
          cat output/cercifaf-kiosk-amd64.iso.sha256

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: cercifaf-kiosk-amd64
          path: |
            output/cercifaf-kiosk-amd64.iso
            output/cercifaf-kiosk-amd64.iso.sha256
          retention-days: 30

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            output/cercifaf-kiosk-amd64.iso
            output/cercifaf-kiosk-amd64.iso.sha256
          generate_release_notes: true