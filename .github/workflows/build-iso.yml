name: Build CERCIFAF Kiosk ISO

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build ISO (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            live-build debootstrap squashfs-tools xorriso \
            mtools dosfstools \
            curl python3 binutils xz-utils \
            syslinux syslinux-common syslinux-utils

      - name: Build ISO
        run: |
          sudo ./build.sh

      - name: Verify ISO
        run: |
          test -f output/cercifaf-kiosk-amd64.iso
          ls -lh output/cercifaf-kiosk-amd64.iso
          file output/cercifaf-kiosk-amd64.iso
          sha256sum output/cercifaf-kiosk-amd64.iso > output/cercifaf-kiosk-amd64.iso.sha256
          cat output/cercifaf-kiosk-amd64.iso.sha256

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: cercifaf-kiosk-amd64
          path: |
            output/cercifaf-kiosk-amd64.iso
            output/cercifaf-kiosk-amd64.iso.sha256
          retention-days: 30

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            output/cercifaf-kiosk-amd64.iso
            output/cercifaf-kiosk-amd64.iso.sha256
          generate_release_notes: true