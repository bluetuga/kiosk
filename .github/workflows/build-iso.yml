name: Build CERCIFAF Kiosk ISO

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build ISO (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          # Install all packages FIRST
          sudo apt-get install -y --no-install-recommends \
            live-build debootstrap squashfs-tools xorriso \
            mtools dosfstools \
            curl python3 binutils xz-utils syslinux syslinux-common syslinux-utils

      - name: Setup syslinux files
        run: |
          # Verify isohybrid is available (provided by syslinux-utils)
          echo "Checking isohybrid..."
          which isohybrid || (echo "isohybrid not found in PATH" && exit 1)
          isohybrid --version
          echo "isohybrid OK"

          # Find syslinux files - list ALL locations
          echo "Searching for syslinux files..."
          find /usr -name "isolinux.bin" -type f 2>/dev/null
          find /usr -name "vesamenu.c32" -type f 2>/dev/null

          SYSLINUX_DIR=""
          for d in /usr/lib/syslinux /usr/share/syslinux /usr/lib/ISOLINUX /usr/lib/syslinux/modules/bios /usr/lib/syslinux/bios; do
            if [ -f "$d/isolinux.bin" ]; then
              SYSLINUX_DIR="$d"
              echo "Found syslinux files in: $SYSLINUX_DIR"
              break
            fi
          done

          # If isolinux.bin not found, download from Debian 13 (trixie) - same as build.sh Docker
          # Debian 13 syslinux-common has isolinux.bin in /usr/lib/syslinux/bios/
          if [ -z "$SYSLINUX_DIR" ]; then
            echo "isolinux.bin not found in Ubuntu packages, downloading from Debian 13 (trixie)..."
            mkdir -p /tmp/syslinux-download
            cd /tmp/syslinux-download
            # Download from Debian 13 (trixie) - same version as build.sh Docker container
            curl -fsSL "http://deb.debian.org/debian/pool/main/s/syslinux/syslinux-common_6.04~git20190206.bf6db5b4+dfsg1-3_all.deb" -o syslinux-common.deb
            dpkg-deb -x syslinux-common.deb .
            # Also get syslinux for the bootloader
            curl -fsSL "http://deb.debian.org/debian/pool/main/s/syslinux/syslinux_6.04~git20190206.bf6db5b4+dfsg1-3.1_amd64.deb" -o syslinux.deb
            dpkg-deb -x syslinux.deb .
            echo "Extracted package contents (all files):"
            find /tmp/syslinux-download -type f 2>/dev/null | sort
            # Find BIOS bootloader - try multiple names/locations
            ISOLINUX_BIN=$(find /tmp/syslinux-download -type f \( -name "isolinux.bin" -o -name "isohdpfx.bin" -o -name "ldlinux.sys" -o -name "syslinux.bin" \) 2>/dev/null | head -1)
            if [ -z "$ISOLINUX_BIN" ]; then
              echo "ERROR: No BIOS bootloader found in extracted packages"
              exit 1
            fi
            SYSLINUX_DIR=$(dirname "$ISOLINUX_BIN")
            echo "Found bootloader at: $ISOLINUX_BIN"
            echo "Using SYSLINUX_DIR: $SYSLINUX_DIR"
            ls -la "$SYSLINUX_DIR"/
          fi

          if [ -z "$SYSLINUX_DIR" ]; then
            echo "ERROR: No suitable bootloader found after download attempt"
            exit 1
          fi

          # NOW setup syslinux files AFTER all packages installed
          sudo mkdir -p /usr/lib/syslinux
          # Copy isolinux.bin or equivalent
          if [ -f "$SYSLINUX_DIR/isolinux.bin" ]; then
            sudo cp "$SYSLINUX_DIR"/isolinux.bin /usr/lib/syslinux/
          elif [ -f "$SYSLINUX_DIR/isohdpfx.bin" ]; then
            sudo cp "$SYSLINUX_DIR"/isohdpfx.bin /usr/lib/syslinux/isolinux.bin
          elif [ -f "$SYSLINUX_DIR/ldlinux.sys" ]; then
            sudo cp "$SYSLINUX_DIR"/ldlinux.sys /usr/lib/syslinux/isolinux.bin
          elif [ -f "$SYSLINUX_DIR/syslinux.bin" ]; then
            sudo cp "$SYSLINUX_DIR"/syslinux.bin /usr/lib/syslinux/isolinux.bin
          fi
          sudo cp "$SYSLINUX_DIR"/vesamenu.c32 /usr/lib/syslinux/ 2>/dev/null || true
          sudo cp "$SYSLINUX_DIR"/libcom32.c32 /usr/lib/syslinux/ 2>/dev/null || true
          sudo cp "$SYSLINUX_DIR"/libutil.c32 /usr/lib/syslinux/ 2>/dev/null || true
          sudo cp "$SYSLINUX_DIR"/menu.c32 /usr/lib/syslinux/ 2>/dev/null || true

          # Fix /root/isolinux: remove whatever postinst created, create symlink
          echo "Checking /root/isolinux before fix..."
          ls -ld /root/isolinux 2>/dev/null || echo "Does not exist"
          sudo rm -rf /root/isolinux
          sudo ln -sf /usr/lib/syslinux /root/isolinux

          # Also copy to /root/isolinux for binary_syslinux
          if [ -f "$SYSLINUX_DIR/isolinux.bin" ]; then
            sudo cp "$SYSLINUX_DIR"/isolinux.bin /root/isolinux/ 2>/dev/null || true
          elif [ -f "$SYSLINUX_DIR/isohdpfx.bin" ]; then
            sudo cp "$SYSLINUX_DIR"/isohdpfx.bin /root/isolinux/isolinux.bin 2>/dev/null || true
          elif [ -f "$SYSLINUX_DIR/ldlinux.sys" ]; then
            sudo cp "$SYSLINUX_DIR"/ldlinux.sys /root/isolinux/isolinux.bin 2>/dev/null || true
          elif [ -f "$SYSLINUX_DIR/syslinux.bin" ]; then
            sudo cp "$SYSLINUX_DIR"/syslinux.bin /root/isolinux/isolinux.bin 2>/dev/null || true
          fi
          sudo cp "$SYSLINUX_DIR"/vesamenu.c32 /root/isolinux/ 2>/dev/null || true
          sudo cp "$SYSLINUX_DIR"/libcom32.c32 /root/isolinux/ 2>/dev/null || true
          sudo cp "$SYSLINUX_DIR"/libutil.c32 /root/isolinux/ 2>/dev/null || true
          sudo cp "$SYSLINUX_DIR"/menu.c32 /root/isolinux/ 2>/dev/null || true

          echo "Syslinux files setup complete"
          ls -la /usr/lib/syslinux/
          ls -la /root/isolinux/

      - name: Build ISO
        run: |
          sudo ./build.sh

      - name: Verify ISO
        run: |
          ls -lh output/cercifaf-kiosk-amd64.iso
          file output/cercifaf-kiosk-amd64.iso
          sha256sum output/cercifaf-kiosk-amd64.iso > output/cercifaf-kiosk-amd64.iso.sha256
          cat output/cercifaf-kiosk-amd64.iso.sha256

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: cercifaf-kiosk-amd64
          path: |
            output/cercifaf-kiosk-amd64.iso
            output/cercifaf-kiosk-amd64.iso.sha256
          retention-days: 30

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            output/cercifaf-kiosk-amd64.iso
            output/cercifaf-kiosk-amd64.iso.sha256
          generate_release_notes: true