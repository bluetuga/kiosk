name: Build CERCIFAF Kiosk ISO

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build ISO (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          # Install syslinux packages (syslinux installs binaries on Ubuntu 24.04)
          sudo apt-get install -y --no-install-recommends syslinux syslinux-common syslinux-utils
          # Find where the files were installed (Ubuntu 24.04 may put them in different locations)
          SYSLINUX_DIR=$(find /usr -name "isolinux.bin" -type f 2>/dev/null | head -1 | xargs -r dirname)
          if [ -z "$SYSLINUX_DIR" ]; then
            # Check all common locations
            for d in /usr/lib/syslinux /usr/share/syslinux /usr/lib/ISOLINUX /usr/lib/syslinux/modules/bios; do
              if [ -f "$d/isolinux.bin" ]; then
                SYSLINUX_DIR="$d"
                break
              fi
            done
          fi
          echo "Found syslinux files in: ${SYSLINUX_DIR:-NOT_FOUND}"
          if [ -z "$SYSLINUX_DIR" ] || [ ! -f "$SYSLINUX_DIR/isolinux.bin" ]; then
            echo "ERROR: isolinux.bin not found after installing syslinux packages"
            echo "Searching for isolinux* files:"
            find /usr -name "isolinux*" -type f 2>/dev/null | head -30
            echo "Searching for syslinux directories:"
            find /usr -type d -name "*syslinux*" 2>/dev/null | head -20
            exit 1
          fi
          # Setup syslinux files for live-build binary stage
          sudo mkdir -p /root/isolinux
          sudo cp "$SYSLINUX_DIR"/isolinux.bin /root/isolinux/
          sudo cp "$SYSLINUX_DIR"/vesamenu.c32 /root/isolinux/ 2>/dev/null || true
          sudo cp "$SYSLINUX_DIR"/libcom32.c32 /root/isolinux/ 2>/dev/null || true
          sudo cp "$SYSLINUX_DIR"/libutil.c32 /root/isolinux/ 2>/dev/null || true
          sudo cp "$SYSLINUX_DIR"/menu.c32 /root/isolinux/ 2>/dev/null || true
          # Also copy from /usr/lib/syslinux/modules/bios if that's where c32 files are
          if [ -d /usr/lib/syslinux/modules/bios ]; then
            sudo cp /usr/lib/syslinux/modules/bios/*.c32 /root/isolinux/ 2>/dev/null || true
          fi
          # Now install remaining packages
          sudo apt-get install -y --no-install-recommends \
            live-build debootstrap squashfs-tools xorriso \
            mtools dosfstools \
            curl python3 binutils xz-utils
          # Verify isohybrid is available (provided by syslinux-utils)
          echo "Checking isohybrid..."
          which isohybrid || (echo "isohybrid not found in PATH" && exit 1)
          isohybrid --version
          echo "isohybrid OK"

      - name: Build ISO
        run: |
          sudo ./build.sh

      - name: Verify ISO
        run: |
          ls -lh output/cercifaf-kiosk-amd64.iso
          file output/cercifaf-kiosk-amd64.iso
          sha256sum output/cercifaf-kiosk-amd64.iso > output/cercifaf-kiosk-amd64.iso.sha256
          cat output/cercifaf-kiosk-amd64.iso.sha256

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: cercifaf-kiosk-amd64
          path: |
            output/cercifaf-kiosk-amd64.iso
            output/cercifaf-kiosk-amd64.iso.sha256
          retention-days: 30

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            output/cercifaf-kiosk-amd64.iso
            output/cercifaf-kiosk-amd64.iso.sha256
          generate_release_notes: true