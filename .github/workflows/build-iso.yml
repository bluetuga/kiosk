name: Build CERCIFAF Kiosk ISO

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build ISO (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          # Pre-setup syslinux files BEFORE installing syslinux packages
          # (Ubuntu syslinux postinst tries to copy to /root/isolinux/ and fails if not ready)
          sudo mkdir -p /root/isolinux
          sudo mkdir -p /usr/lib/syslinux
          sudo ln -sf /usr/lib/syslinux /root/isolinux
          # Install live-build and other tools
          sudo apt-get install -y --no-install-recommends \
            live-build debootstrap squashfs-tools xorriso \
            mtools dosfstools \
            curl python3 binutils xz-utils syslinux syslinux-utils
          # Verify isohybrid is available (provided by syslinux-utils)
          echo "Checking isohybrid..."
          which isohybrid || (echo "isohybrid not found in PATH" && exit 1)
          isohybrid --version
          echo "isohybrid OK"
          # Copy syslinux BIOS files to where live-build expects them
          # Ubuntu 24.04 puts them in /usr/lib/syslinux/bios/
          sudo cp /usr/lib/syslinux/bios/isolinux.bin /usr/lib/syslinux/ 2>/dev/null || true
          sudo cp /usr/lib/syslinux/bios/vesamenu.c32 /usr/lib/syslinux/ 2>/dev/null || true
          sudo cp /usr/lib/syslinux/bios/libcom32.c32 /usr/lib/syslinux/ 2>/dev/null || true
          sudo cp /usr/lib/syslinux/bios/libutil.c32 /usr/lib/syslinux/ 2>/dev/null || true
          sudo cp /usr/lib/syslinux/bios/menu.c32 /usr/lib/syslinux/ 2>/dev/null || true
          # Also copy to /root/isolinux for binary_syslinux
          sudo cp /usr/lib/syslinux/bios/isolinux.bin /root/isolinux/ 2>/dev/null || true
          sudo cp /usr/lib/syslinux/bios/vesamenu.c32 /root/isolinux/ 2>/dev/null || true
          sudo cp /usr/lib/syslinux/bios/libcom32.c32 /root/isolinux/ 2>/dev/null || true
          sudo cp /usr/lib/syslinux/bios/libutil.c32 /root/isolinux/ 2>/dev/null || true
          sudo cp /usr/lib/syslinux/bios/menu.c32 /root/isolinux/ 2>/dev/null || true
          echo "Syslinux files setup complete"
          ls -la /usr/lib/syslinux/
          ls -la /root/isolinux/

      - name: Build ISO
        run: |
          sudo ./build.sh

      - name: Verify ISO
        run: |
          ls -lh output/cercifaf-kiosk-amd64.iso
          file output/cercifaf-kiosk-amd64.iso
          sha256sum output/cercifaf-kiosk-amd64.iso > output/cercifaf-kiosk-amd64.iso.sha256
          cat output/cercifaf-kiosk-amd64.iso.sha256

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: cercifaf-kiosk-amd64
          path: |
            output/cercifaf-kiosk-amd64.iso
            output/cercifaf-kiosk-amd64.iso.sha256
          retention-days: 30

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            output/cercifaf-kiosk-amd64.iso
            output/cercifaf-kiosk-amd64.iso.sha256
          generate_release_notes: true