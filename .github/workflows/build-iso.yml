name: Build CERCIFAF Kiosk ISO

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build ISO (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          # Install all packages FIRST
          sudo apt-get install -y --no-install-recommends \
            live-build debootstrap squashfs-tools xorriso \
            mtools dosfstools \
            curl python3 binutils xz-utils syslinux syslinux-common syslinux-utils

      - name: Setup syslinux files
        run: |
          # Verify isohybrid is available (provided by syslinux-utils)
          echo "Checking isohybrid..."
          which isohybrid || (echo "isohybrid not found in PATH" && exit 1)
          isohybrid --version
          echo "isohybrid OK"

          # Find syslinux files - list ALL locations (including Ubuntu package locations)
          echo "Searching for syslinux files..."
          echo "=== dpkg -L syslinux ==="
          dpkg -L syslinux 2>/dev/null | grep -E '\.(bin|sys|c32)$' || true
          echo "=== dpkg -L syslinux-common ==="
          dpkg -L syslinux-common 2>/dev/null | grep -E '\.(bin|sys|c32)$' || true

          find /usr -name "isolinux.bin" -type f 2>/dev/null
          find /usr -name "isohdpfx.bin" -type f 2>/dev/null
          find /usr -name "ldlinux.sys" -type f 2>/dev/null
          find /usr -name "syslinux.bin" -type f 2>/dev/null
          find /usr -name "vesamenu.c32" -type f 2>/dev/null

          SYSLINUX_DIR=""
          # Search for ANY bootloader file (not just isolinux.bin)
          for d in /usr/lib/syslinux /usr/share/syslinux /usr/lib/ISOLINUX /usr/lib/syslinux/modules/bios /usr/lib/syslinux/bios /usr/lib/syslinux/modules/efi64 /usr/lib/syslinux/modules/efi32; do
            if [ -f "$d/isolinux.bin" ] || [ -f "$d/isohdpfx.bin" ] || [ -f "$d/ldlinux.sys" ] || [ -f "$d/syslinux.bin" ]; then
              SYSLINUX_DIR="$d"
              echo "Found syslinux files in: $SYSLINUX_DIR"
              ls -la "$d"/*.bin "$d"/*.sys 2>/dev/null || true
              break
            fi
          done

          # If isolinux.bin not found, download from Debian (try multiple versions)
          # Debian 13 (trixie) syslinux 6.x lacks BIOS bootloaders; try Debian 12 (bookworm) or 11 (bullseye)
          if [ -z "$SYSLINUX_DIR" ]; then
            echo "isolinux.bin not found in Ubuntu packages, downloading from Debian..."
            mkdir -p /tmp/syslinux-download
            cd /tmp/syslinux-download

            # Try Debian versions in order: 12 (bookworm), 11 (bullseye), 10 (buster) - older have isolinux.bin
            for debian_ver in "bookworm" "bullseye" "buster"; do
              echo "Trying Debian $debian_ver..."
              # Download syslinux-common (modules)
              curl -fsSL "http://deb.debian.org/debian/pool/main/s/syslinux/syslinux-common_6.04~git20190206.bf6db5b4+dfsg1-3_all.deb" -o syslinux-common.deb 2>/dev/null || \
              curl -fsSL "http://deb.debian.org/debian/pool/main/s/syslinux/syslinux-common_6.03-14+deb10u1_all.deb" -o syslinux-common.deb 2>/dev/null || \
              curl -fsSL "http://deb.debian.org/debian/pool/main/s/syslinux/syslinux-common_6.04~git20190206.bf6db5b4+dfsg1-2_all.deb" -o syslinux-common.deb 2>/dev/null || continue
              dpkg-deb -x syslinux-common.deb .

              # Download syslinux (bootloaders)
              curl -fsSL "http://deb.debian.org/debian/pool/main/s/syslinux/syslinux_6.04~git20190206.bf6db5b4+dfsg1-3.1_amd64.deb" -o syslinux.deb 2>/dev/null || \
              curl -fsSL "http://deb.debian.org/debian/pool/main/s/syslinux/syslinux_6.03-14+deb10u1_amd64.deb" -o syslinux.deb 2>/dev/null || \
              curl -fsSL "http://deb.debian.org/debian/pool/main/s/syslinux/syslinux_6.04~git20190206.bf6db5b4+dfsg1-2_amd64.deb" -o syslinux.deb 2>/dev/null || continue
              dpkg-deb -x syslinux.deb .

              echo "Extracted package contents (all files):"
              find /tmp/syslinux-download -type f 2>/dev/null | sort

              # Find BIOS bootloader - try multiple names/locations
              ISOLINUX_BIN=$(find /tmp/syslinux-download -type f \( -name "isolinux.bin" -o -name "isohdpfx.bin" -o -name "ldlinux.sys" -o -name "syslinux.bin" \) 2>/dev/null | head -1)
              if [ -n "$ISOLINUX_BIN" ]; then
                SYSLINUX_DIR=$(dirname "$ISOLINUX_BIN")
                echo "Found bootloader at: $ISOLINUX_BIN (from Debian $debian_ver)"
                echo "Using SYSLINUX_DIR: $SYSLINUX_DIR"
                ls -la "$SYSLINUX_DIR"/
                break
              else
                echo "No BIOS bootloader in Debian $debian_ver, trying next..."
                rm -rf /tmp/syslinux-download/*
              fi
            done

            if [ -z "$ISOLINUX_BIN" ]; then
              echo "ERROR: No BIOS bootloader found in any Debian version"
              exit 1
            fi
          fi

          if [ -z "$SYSLINUX_DIR" ]; then
            echo "ERROR: No suitable bootloader found after download attempt"
            exit 1
          fi

          # NOW setup syslinux files AFTER all packages installed
          # syslinux 6.x: use isohdpfx.bin as isolinux.bin (for live-build binary_syslinux)
          # AND copy ldlinux.sys (the actual bootloader) - BOTH required for iso-hybrid boot
          sudo mkdir -p /usr/lib/syslinux

          # Copy isohdpfx.bin as isolinux.bin (required by live-build's binary_syslinux)
          if [ -f "$SYSLINUX_DIR/isohdpfx.bin" ]; then
            sudo cp "$SYSLINUX_DIR"/isohdpfx.bin /usr/lib/syslinux/isolinux.bin
            echo "Copied isohdpfx.bin -> /usr/lib/syslinux/isolinux.bin"
          elif [ -f "$SYSLINUX_DIR/isolinux.bin" ]; then
            sudo cp "$SYSLINUX_DIR"/isolinux.bin /usr/lib/syslinux/
            echo "Copied isolinux.bin"
          else
            echo "ERROR: Neither isohdpfx.bin nor isolinux.bin found in $SYSLINUX_DIR"
            exit 1
          fi

          # Copy ldlinux.sys (syslinux 6.x bootloader) - REQUIRED for boot
          if [ -f "$SYSLINUX_DIR/ldlinux.sys" ]; then
            sudo cp "$SYSLINUX_DIR"/ldlinux.sys /usr/lib/syslinux/
            echo "Copied ldlinux.sys"
          else
            echo "WARNING: ldlinux.sys not found in $SYSLINUX_DIR, boot may fail"
          fi

          # Copy COM32 modules
          sudo cp "$SYSLINUX_DIR"/vesamenu.c32 /usr/lib/syslinux/ 2>/dev/null || true
          sudo cp "$SYSLINUX_DIR"/libcom32.c32 /usr/lib/syslinux/ 2>/dev/null || true
          sudo cp "$SYSLINUX_DIR"/libutil.c32 /usr/lib/syslinux/ 2>/dev/null || true
          sudo cp "$SYSLINUX_DIR"/menu.c32 /usr/lib/syslinux/ 2>/dev/null || true

          # Fix /root/isolinux: remove whatever postinst created, create symlink
          echo "Checking /root/isolinux before fix..."
          ls -ld /root/isolinux 2>/dev/null || echo "Does not exist"
          sudo rm -rf /root/isolinux
          sudo ln -sf /usr/lib/syslinux /root/isolinux

          # Also copy to /root/isolinux for binary_syslinux
          sudo cp /usr/lib/syslinux/isolinux.bin /root/isolinux/isolinux.bin 2>/dev/null || true
          sudo cp /usr/lib/syslinux/ldlinux.sys /root/isolinux/ 2>/dev/null || true
          sudo cp /usr/lib/syslinux/vesamenu.c32 /root/isolinux/ 2>/dev/null || true
          sudo cp /usr/lib/syslinux/libcom32.c32 /root/isolinux/ 2>/dev/null || true
          sudo cp /usr/lib/syslinux/libutil.c32 /root/isolinux/ 2>/dev/null || true
          sudo cp /usr/lib/syslinux/menu.c32 /root/isolinux/ 2>/dev/null || true

          echo "Syslinux files setup complete"
          ls -la /usr/lib/syslinux/
          ls -la /root/isolinux/

      - name: Build ISO
        run: |
          sudo ./build.sh

      - name: Verify ISO
        run: |
          ls -lh output/cercifaf-kiosk-amd64.iso
          file output/cercifaf-kiosk-amd64.iso
          sha256sum output/cercifaf-kiosk-amd64.iso > output/cercifaf-kiosk-amd64.iso.sha256
          cat output/cercifaf-kiosk-amd64.iso.sha256

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: cercifaf-kiosk-amd64
          path: |
            output/cercifaf-kiosk-amd64.iso
            output/cercifaf-kiosk-amd64.iso.sha256
          retention-days: 30

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            output/cercifaf-kiosk-amd64.iso
            output/cercifaf-kiosk-amd64.iso.sha256
          generate_release_notes: true